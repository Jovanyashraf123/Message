<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>❤️NANCY❤️</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="hearts" aria-hidden="true"></div>

    <main class="page">
      <h1>❤️❤️Nancy❤️❤️</h1>
      <h1>❤️A little letter for you ❤️</h1>
      <p class="subtitle">Press OPEN to reveal the message</p>

      <div class="envelope-area">
        <div id="envelope" class="envelope">
          <div class="letter">
            <span class="to">To: My Love Nancy ❤️</span>
            <p>I love you, and I’ll keep loving you no matter what happens.</p>
            <p>7abibek Jovany</p>
            <div class="signature">With love ❤️</div>
          </div>

          <div class="back"></div>
          <div class="flap"></div>
          <div class="left-fold"></div>
          <div class="right-fold"></div>
          <div class="bottom-fold"></div>
          <div class="seal">♥</div>
        </div>
      </div>

      <div class="buttons">
        <button id="openBtn">OPEN</button>
        <button id="closeBtn">CLOSE</button>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
